<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="interact.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200&display=swap" rel="stylesheet">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <section class="alert-section" aria-live="assertive"> <!-- announce the changes to the screen readers-->
        <section class="alert-container">
            <p class="alert-text">You Win</p>
            <button type="button" class="again-button">Play Again ?</button>
        </section>
    </section> 

    <header> 
        <h1>Rock Paper Scissors</h1>
        <p class="score" aria-live="polite">0 - 0</p>
    </header>

    <main>
        <section class="player-section">
            <h2>Player</h2>

            <section class="choice-section">
                <button type="button" class="rock" aria-label="Rock emoji"><img src="pictures/🦆 emoji _fisted hand sign_.jpg" alt="Fist emoji"></button>
                <button type="button" class="paper"  aria-label="Paper emoji"><img src="pictures/🦆 emoji _raised hand with fingers splayed_.jpg" alt="Palm emoji"></button>
                <button type="button" class="scissors" aria-label="Scissors emoji"><img src="pictures/🦆 emoji _victory hand_.jpg" alt="Peace emoji"></button>
            </section>

            <p class="info">Choose a hand</p>
        </section>

        <section class="computer-section">
            <h2>Computer</h2>
            <button type="button" class="computer-choice-img" disabled>?</button>
            <p class="info" aria-live="polite">The computer is choosing...</p>
        </section> 
    </main>

    <footer>
        <p class="result" aria-live="assertive"></p>
    </footer>
</body>
</html>
